[project]
name = "jev-ticket-country"
version = "0.1.0"
description = "Receipt country classification and reproducible evaluation with Jev and trace-it OCR"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
research = ["duckdb>=1.4,<2", "pillow>=11,<13"]
test = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
jev-tickets = "jev_tickets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_tickets"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
